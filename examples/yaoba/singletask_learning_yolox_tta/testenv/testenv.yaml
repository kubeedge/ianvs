testenv:
  # dataset configuration
  dataset:
    # the url address of training set index; string type;
    train_url: "examples/yaoba/singletask_learning_yolox_tta/dataset/train.json"

    # the url address of validation set index; string type;
    val_url: "examples/yaoba/singletask_learning_yolox_tta/dataset/val.json"

    # the url address of test set index; string type;
    test_url: "examples/yaoba/singletask_learning_yolox_tta/dataset/test.json"

    # the image folder url address of train, val, and test sets; string type;
    # relative to the ianvs project root; place the downloaded dataset images here
    # (see examples/yaoba/singletask_learning_yolox_tta/readme/README.md for dataset setup)
    image_folder_url: "examples/yaoba/singletask_learning_yolox_tta/dataset/images"
    # classes: ""
  # metrics configuration for test case's evaluation; list type;
  metrics:
      # metric name; string type;
    - name: "map"
      # the url address of python file
      url: "examples/yaoba/singletask_learning_yolox_tta/testenv/map.py"