algorithm:
  paradigm_type: "singletasklearning"
  initial_model_url: "./models/model.pth"

  modules:
    - type: "basemodel"
      name: "RFNet"
      url: "./examples/Cloud_Robotics/singletask_learning_bench/Semantic_Segmentation/testalgorithms/rfnet/basemodel.py"

      hyperparameters:
        - momentum:
            values:
              - 0.95
              - 0.5
        - learning_rate:
            values:
              - 0.1
        - epochs:
            values:
              - 2
