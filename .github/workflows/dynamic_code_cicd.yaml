name: "Dynamic Code Requirement Verification"

on:
  push:
    branches: [ main ]
    paths:
      - 'examples/**'
      - 'core/**'
      - '.github/workflows/validator/**'
      - '.github/workflows/dynamic_code_cicd.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'examples/**'
      - 'core/**'
      - '.github/workflows/validator/**'
      - '.github/workflows/dynamic_code_cicd.yaml'
  schedule:
    - cron: '31 15 * * *'

jobs:
  plan-scheduled-validation:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      action: ${{ steps.plan.outputs.action }}
      reason: ${{ steps.plan.outputs.reason }}
      tier2_artifact_id: ${{ steps.plan.outputs.tier2_artifact_id }}
      tier2_run_id: ${{ steps.plan.outputs.tier2_run_id }}
      tier2_created_at: ${{ steps.plan.outputs.tier2_created_at }}
      last_validated_at: ${{ steps.plan.outputs.last_validated_at }}
      next_tier3_at: ${{ steps.plan.outputs.next_tier3_at }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.8'

      - name: Plan Tier 3 validation
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            {
              echo "action=run_tier3"
              echo "reason=Tier 3 runs after pushes to main."
              echo "tier2_artifact_id="
              echo "tier2_run_id="
              echo "tier2_created_at="
              echo "last_validated_at="
              echo "next_tier3_at="
            } >> "${GITHUB_OUTPUT}"
          else
            if git fetch --no-tags origin ci-managed/example-health-status; then
              git show FETCH_HEAD:.github/example-status/summary.json \
                > example-status-summary.json
            fi
            python .github/workflows/validator/services/inventory_loader.py \
              --plan-schedule \
              --health-metadata example-status-summary.json \
              --repository "${{ github.repository }}" \
              --cadence-days 7
          fi

      - name: Write validation decision summary
        run: |
          {
            echo "## Tier 3 validation decision"
            echo
            echo "- Action: \`${{ steps.plan.outputs.action }}\`"
            echo "- Reason: ${{ steps.plan.outputs.reason }}"
            echo "- Last validation: \`${{ steps.plan.outputs.last_validated_at || 'Not available' }}\`"
            echo "- Next Tier 3: \`${{ steps.plan.outputs.next_tier3_at || 'Due now' }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  detect-change-examples:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions: read-all
    outputs:
      mode: ${{ steps.check_examples.outputs.mode }}
      run_all: ${{ steps.check_examples.outputs.run_all }}
      examples_changed: ${{ steps.check_examples.outputs.examples_changed }}
      base_examples_changed: ${{ steps.check_examples.outputs.base_examples_changed }}
      head_examples_changed: ${{ steps.check_examples.outputs.head_examples_changed }}
      base_changed_examples: ${{ steps.check_examples.outputs.base_changed_examples }}
      head_changed_examples: ${{ steps.check_examples.outputs.head_changed_examples }}
      base_validation_matrix: ${{ steps.check_examples.outputs.base_validation_matrix }}
      head_validation_matrix: ${{ steps.check_examples.outputs.head_validation_matrix }}
      changed_files: ${{ steps.check_examples.outputs.changed_files }}
      base_check_items: ${{ steps.check_examples.outputs.base_check_items }}
      head_check_items: ${{ steps.check_examples.outputs.head_check_items }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.8'

      - name: Check changed examples
        id: check_examples
        run: |
          python .github/workflows/validator/services/inventory_loader.py \
            --mode dynamic \
            --inventory .github/workflows/validator/data/example_inventory.yaml \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --base-inventory-ref "${{ github.event.pull_request.base.sha }}" \
            --head-ref HEAD

  dynamic-code-requirement-base:
    needs: detect-change-examples
    if: ${{ github.event_name == 'pull_request' && needs.detect-change-examples.outputs.base_examples_changed == 'true' }}
    runs-on: ubuntu-latest
    permissions: read-all
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-change-examples.outputs.base_validation_matrix) }}
    name: ${{ format('Base dynamic example validation ({0}, Python {1})', matrix.selector, matrix.python_version) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install validator dependencies
        run: python -m pip install -r .github/workflows/validator/requirements.txt

      - name: Prepare base validation worktree
        run: |
          base_dir="$(mktemp -d)"
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git worktree add --detach "${base_dir}" FETCH_HEAD
          echo "IANVS_BASE_DIR=${base_dir}" >> "${GITHUB_ENV}"

      - name: Install base Ianvs runtime dependencies
        run: |
          (
            cd "${IANVS_BASE_DIR}"
            python -m pip install -r requirements.txt
            python -m pip install resources/third_party/sedna-0.6.0.1-py3-none-any.whl
            python -m pip install -e . --no-deps
          )

      - name: Run base dynamic example validation
        id: run_validation
        continue-on-error: true
        run: |
          safe_name="$(printf '%s' "${{ matrix.selector }}" | tr -c 'A-Za-z0-9._-' '-')"
          result_file="${GITHUB_WORKSPACE}/baseline-results/${safe_name}.json"
          log_file="${GITHUB_WORKSPACE}/baseline-results/${safe_name}.log"
          mkdir -p "${GITHUB_WORKSPACE}/baseline-results"
          echo "artifact_name=dynamic-validation-base-${safe_name}" >> "${GITHUB_OUTPUT}"
          echo "result_file=${result_file}" >> "${GITHUB_OUTPUT}"
          echo "log_file=${log_file}" >> "${GITHUB_OUTPUT}"

          (
            cd "${IANVS_BASE_DIR}"
            python "${IANVS_BASE_DIR}/.github/workflows/validator/validation_runner.py" \
              --dependency \
              --pip-install \
              --prepare-env \
              --smoke \
              --example "${{ matrix.selector }}" \
              --inventory "${IANVS_BASE_DIR}/.github/workflows/validator/data/example_inventory.yaml" \
              --format json \
              --report "${result_file}"
          ) 2>&1 | tee "${log_file}"

      - name: Upload base dynamic validation result
        if: ${{ always() && steps.run_validation.outputs.result_file != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.run_validation.outputs.artifact_name }}
          path: |
            ${{ steps.run_validation.outputs.result_file }}
            ${{ steps.run_validation.outputs.log_file }}
          if-no-files-found: ignore

  dynamic-code-requirement-pr:
    needs: detect-change-examples
    if: ${{ github.event_name != 'schedule' && needs.detect-change-examples.outputs.head_examples_changed == 'true' }}
    runs-on: ubuntu-latest
    permissions: read-all
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-change-examples.outputs.head_validation_matrix) }}
    name: ${{ format('PR dynamic example validation ({0}, Python {1})', matrix.selector, matrix.python_version) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install validator dependencies
        run: python -m pip install -r .github/workflows/validator/requirements.txt

      - name: Install Ianvs runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install resources/third_party/sedna-0.6.0.1-py3-none-any.whl
          python -m pip install -e . --no-deps

      - name: Run PR dynamic example validation
        id: run_validation
        continue-on-error: true
        run: |
          safe_name="$(printf '%s' "${{ matrix.selector }}" | tr -c 'A-Za-z0-9._-' '-')"
          result_file="validation-results/${safe_name}.json"
          log_file="validation-results/${safe_name}.log"
          mkdir -p validation-results
          echo "artifact_name=dynamic-validation-pr-${safe_name}" >> "${GITHUB_OUTPUT}"
          echo "result_file=${result_file}" >> "${GITHUB_OUTPUT}"
          echo "log_file=${log_file}" >> "${GITHUB_OUTPUT}"

          python .github/workflows/validator/validation_runner.py \
            --dependency \
            --pip-install \
            --prepare-env \
            --smoke \
            --example "${{ matrix.selector }}" \
            --inventory .github/workflows/validator/data/example_inventory.yaml \
            --format json \
            --report "${result_file}" \
            2>&1 | tee "${log_file}"

      - name: Upload PR dynamic validation result
        if: ${{ always() && steps.run_validation.outputs.result_file != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.run_validation.outputs.artifact_name }}
          path: |
            ${{ steps.run_validation.outputs.result_file }}
            ${{ steps.run_validation.outputs.log_file }}
          if-no-files-found: ignore

  regression-dynamic-code-requirement:
    needs:
      - detect-change-examples
      - dynamic-code-requirement-base
      - dynamic-code-requirement-pr
    if: ${{ always() && github.event_name == 'pull_request' && needs.detect-change-examples.outputs.examples_changed == 'true' }}
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.8'

      - name: Install validator dependencies
        run: python -m pip install -r .github/workflows/validator/requirements.txt

      - name: Download base dynamic validation results
        if: ${{ needs.detect-change-examples.outputs.base_examples_changed == 'true' }}
        uses: actions/download-artifact@v8
        with:
          pattern: dynamic-validation-base-*
          path: baseline-results
          merge-multiple: true

      - name: Download PR dynamic validation results
        if: ${{ needs.detect-change-examples.outputs.head_examples_changed == 'true' }}
        uses: actions/download-artifact@v8
        with:
          pattern: dynamic-validation-pr-*
          path: validation-results
          merge-multiple: true

      - name: Detect PR regressions
        id: detect_regression
        continue-on-error: true
        run: |
          python .github/workflows/validator/services/regression_detector.py \
            --base-results baseline-results \
            --head-results validation-results \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --head-ref HEAD \
            --allow-missing-base \
            --allow-missing-head \
            --json-output regression-report.json \
            --json-only

      - name: Upload regression report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: dynamic-validation-regression-report
          path: regression-report.json
          if-no-files-found: ignore

      - name: Fail on PR regression
        if: ${{ steps.detect_regression.outcome == 'failure' }}
        run: exit 1

  report-dynamic-code-requirement:
    needs:
      - detect-change-examples
      - regression-dynamic-code-requirement
      - dynamic-code-requirement-pr
    if: ${{ always() && needs.detect-change-examples.outputs.examples_changed == 'true' }}
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.8'

      - name: Install validator dependencies
        run: python -m pip install -r .github/workflows/validator/requirements.txt

      - name: Download dynamic validation results
        if: ${{ needs.detect-change-examples.outputs.head_examples_changed == 'true' }}
        uses: actions/download-artifact@v8
        with:
          pattern: dynamic-validation-pr-*
          path: validation-results
          merge-multiple: true

      - name: Download regression report
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/download-artifact@v8
        with:
          name: dynamic-validation-regression-report
          path: .

      - name: Collect dynamic validation artifact metadata
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --paginate \
            --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            > dynamic-validation-artifacts.json

      - name: Generate dynamic validation report
        run: |
          python .github/workflows/validator/services/report_generator.py \
            --results validation-results \
            --mode dynamic \
            --output dynamic-validation-report.md \
            --regression-json regression-report.json \
            --artifacts-json dynamic-validation-artifacts.json \
            --step-summary \
            --allow-empty \
            --no-fail

      - name: Upload dynamic validation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: dynamic-validation-report
          path: |
            dynamic-validation-report.md
            regression-report.json
          if-no-files-found: ignore

  collect-tier2-base-health-results:
    needs:
      - detect-change-examples
      - dynamic-code-requirement-base
    if: ${{ always() && github.event_name == 'pull_request' && needs.detect-change-examples.outputs.run_all == 'true' && needs.detect-change-examples.outputs.examples_changed == 'true' }}
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - uses: actions/checkout@v7

      - name: Download Tier 2 base validation results
        if: ${{ needs.detect-change-examples.outputs.base_examples_changed == 'true' }}
        uses: actions/download-artifact@v8
        with:
          pattern: dynamic-validation-base-*
          path: baseline-results
          merge-multiple: true

      - name: Verify full Tier 2 base result set
        env:
          EXPECTED_EXAMPLES: ${{ needs.detect-change-examples.outputs.base_changed_examples }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = len(json.loads(os.environ["EXPECTED_EXAMPLES"]))
          actual = len(list(Path("baseline-results").glob("*.json")))
          if actual != expected:
              raise SystemExit(
                  "Tier 2 base results are incomplete: expected {}, found {}".format(
                      expected, actual
                  )
              )
          PY

      - name: Record Tier 2 base metadata
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          metadata = {
              "repository": os.environ["REPOSITORY"],
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_sha": os.environ["BASE_SHA"],
              "source_tier": "T2",
              "validated_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          Path("tier2-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Tier 2 base health results
        uses: actions/upload-artifact@v7
        with:
          name: tier2-base-health-results
          path: |
            baseline-results/*.json
            tier2-metadata.json
          retention-days: 30
          overwrite: true

  publish-tier2-example-health:
    needs: plan-scheduled-validation
    if: ${{ needs.plan-scheduled-validation.outputs.action == 'publish_tier2' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: example-status
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.8'

      - name: Install validator dependencies
        run: python -m pip install -r .github/workflows/validator/requirements.txt

      - name: Download yesterday's Tier 2 base results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ needs.plan-scheduled-validation.outputs.tier2_run_id }}" \
            --name tier2-base-health-results \
            --dir tier2-health

      - name: Generate Tier 2 example status snapshots
        run: |
          python .github/workflows/validator/services/report_generator.py \
            --results tier2-health/baseline-results \
            --inventory .github/workflows/validator/data/example_inventory.yaml \
            --health-metadata tier2-health/tier2-metadata.json \
            --example-status-output status-results \
            --no-fail

      - name: Publish Tier 2 snapshots to ci-managed/example-health-status
        run: |
          status_worktree="$(mktemp -d)"
          if git fetch --no-tags origin ci-managed/example-health-status; then
            git worktree add -b ci-managed/example-health-status "${status_worktree}" FETCH_HEAD
          else
            git worktree add -b ci-managed/example-health-status "${status_worktree}" HEAD
          fi
          git -C "${status_worktree}" rm -r --ignore-unmatch .github/workflows/result
          mkdir -p "${status_worktree}/.github/example-status"
          cp status-results/*.json "${status_worktree}/.github/example-status/"
          git -C "${status_worktree}" config user.name "github-actions[bot]"
          git -C "${status_worktree}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${status_worktree}" add .github/example-status
          if git -C "${status_worktree}" diff --cached --quiet; then
            echo "The Tier 2 example status snapshots are already current."
            exit 0
          fi
          git -C "${status_worktree}" commit -m "ci: update example status from Tier 2"
          git -C "${status_worktree}" push origin ci-managed/example-health-status

  select-tier3-examples:
    needs: plan-scheduled-validation
    if: ${{ needs.plan-scheduled-validation.outputs.action == 'run_tier3' }}
    runs-on: ubuntu-latest
    permissions: read-all
    outputs:
      examples: ${{ steps.select.outputs.changed_examples }}
      validation_matrix: ${{ steps.select.outputs.validation_matrix }}
      examples_changed: ${{ steps.select.outputs.examples_changed }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.8'

      - name: Select active Tier 3 examples
        id: select
        run: |
          python .github/workflows/validator/services/inventory_loader.py \
            --schedule \
            --mode dynamic \
            --inventory .github/workflows/validator/data/example_inventory.yaml

  tier3-example-validation:
    needs:
      - plan-scheduled-validation
      - select-tier3-examples
    if: ${{ needs.plan-scheduled-validation.outputs.action == 'run_tier3' && needs.select-tier3-examples.outputs.examples_changed == 'true' }}
    runs-on: ubuntu-latest
    permissions: read-all
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.select-tier3-examples.outputs.validation_matrix) }}
    name: ${{ format('Tier 3 example validation ({0}, Python {1})', matrix.selector, matrix.python_version) }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install validator dependencies
        run: python -m pip install -r .github/workflows/validator/requirements.txt

      - name: Install Ianvs runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install resources/third_party/sedna-0.6.0.1-py3-none-any.whl
          python -m pip install -e . --no-deps

      - name: Run Tier 3 validation
        id: validation
        continue-on-error: true
        run: |
          safe_name="$(printf '%s' "${{ matrix.selector }}" | tr -c 'A-Za-z0-9._-' '-')"
          result_file="tier3-results/${safe_name}.json"
          mkdir -p tier3-results
          echo "artifact_name=tier3-validation-${safe_name}" >> "${GITHUB_OUTPUT}"
          echo "result_file=${result_file}" >> "${GITHUB_OUTPUT}"
          python .github/workflows/validator/validation_runner.py \
            --dependency \
            --pip-install \
            --prepare-env \
            --smoke \
            --example "${{ matrix.selector }}" \
            --inventory .github/workflows/validator/data/example_inventory.yaml \
            --format json \
            --report "${result_file}"

      - name: Upload Tier 3 example result
        if: ${{ always() && steps.validation.outputs.result_file != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.validation.outputs.artifact_name }}
          path: ${{ steps.validation.outputs.result_file }}
          if-no-files-found: ignore

  publish-tier3-example-health:
    needs:
      - plan-scheduled-validation
      - select-tier3-examples
      - tier3-example-validation
    if: ${{ always() && needs.plan-scheduled-validation.outputs.action == 'run_tier3' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: example-status
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.8'

      - name: Install validator dependencies
        run: python -m pip install -r .github/workflows/validator/requirements.txt

      - name: Download Tier 3 results
        uses: actions/download-artifact@v8
        with:
          pattern: tier3-validation-*
          path: tier3-results
          merge-multiple: true

      - name: Verify complete Tier 3 result set
        env:
          EXPECTED_EXAMPLES: ${{ needs.select-tier3-examples.outputs.examples }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = len(json.loads(os.environ["EXPECTED_EXAMPLES"]))
          actual = len(list(Path("tier3-results").glob("*.json")))
          if actual != expected:
              raise SystemExit(
                  "Tier 3 results are incomplete: expected {}, found {}".format(
                      expected, actual
                  )
              )
          PY

      - name: Record Tier 3 metadata
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          metadata = {
              "repository": os.environ["REPOSITORY"],
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_sha": os.environ["SOURCE_SHA"],
              "source_tier": "T3",
              "validated_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          Path("tier3-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Render Tier 3 report
        run: |
          python .github/workflows/validator/services/report_generator.py \
            --results tier3-results \
            --mode dynamic \
            --output tier3-validation-report.md \
            --step-summary \
            --no-fail

      - name: Generate Tier 3 example status snapshots
        run: |
          python .github/workflows/validator/services/report_generator.py \
            --results tier3-results \
            --inventory .github/workflows/validator/data/example_inventory.yaml \
            --health-metadata tier3-metadata.json \
            --example-status-output status-results \
            --no-fail

      - name: Upload Tier 3 health report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: tier3-example-health-report
          path: |
            tier3-results/
            tier3-metadata.json
            tier3-validation-report.md
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true

      - name: Publish Tier 3 snapshots to ci-managed/example-health-status
        run: |
          status_worktree="$(mktemp -d)"
          if git fetch --no-tags origin ci-managed/example-health-status; then
            git worktree add -b ci-managed/example-health-status "${status_worktree}" FETCH_HEAD
          else
            git worktree add -b ci-managed/example-health-status "${status_worktree}" HEAD
          fi
