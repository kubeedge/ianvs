name: "Validator Contract Tests"

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/validator/**'
      - '.github/workflows/validator_contract_tests.yaml'
      - '.github/workflows/static_code_requirement_cicd.yaml'
      - '.github/workflows/dynamic_code_cicd.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/validator/**'
      - '.github/workflows/validator_contract_tests.yaml'
      - '.github/workflows/static_code_requirement_cicd.yaml'
      - '.github/workflows/dynamic_code_cicd.yaml'

permissions:
  contents: read

jobs:
  validator-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.8'

      - name: Install validator dependencies
        run: python -m pip install -r .github/workflows/validator/requirements.txt

      - name: Run validator contract tests
        run: >-
          python -m unittest discover
          -s .github/workflows/validator/tests
          -p 'test_*.py'
          -v
