name: CI

on:
  push:
    branches:
      - main
    tags:
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  pylint:
    runs-on: ubuntu-22.04
    name: pylint
    strategy:
      matrix:
        python-version: [ "3.9", "3.10", "3.11", "3.12" ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libgl1-mesa-glx -y
          python -m pip install --upgrade pip
          python -m pip install pylint
          python -m pip install ${{github.workspace}}/resources/third_party/*
          python -m pip install -r ${{github.workspace}}/requirements.txt
      - name: Analysing code of core with pylint
        run: pylint --max-positional-arguments=10 '${{github.workspace}}/core'
      - name: Validate Ianvs Examples
        run: python ${{github.workspace}}/.github/scripts/validate_examples.py
