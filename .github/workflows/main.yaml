name: CI

on:
  push:
    branches:
      - main
    tags:
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  pylint:
    runs-on: ubuntu-22.04
    name: pylint
    strategy:
      matrix:
        python-version: [ "3.7", "3.8", "3.9" ]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libgl1-mesa-glx -y
          python -m pip install pip==24.0
          python -m pip install  pylint
          python -m pip install ${{github.workspace}}/resources/third_party/*
          python -m pip install -r ${{github.workspace}}/requirements.txt
      - name: Analysing code of core with pylint
        # `--max-positional-arguments=10` is set for Python 3.9 to avoid `R0917: too-many-positional-arguments`.
        # See details at https://github.com/kubeedge/ianvs/issues/157
        run: |
          if [ "${{ matrix.python-version }}" = "3.9" ]; then
            pylint --max-positional-arguments=10 '${{github.workspace}}/core'
          else
            pylint '${{github.workspace}}/core'
          fi

  validate-example-configs:
    runs-on: ubuntu-22.04
    name: validate example configs
    strategy:
      matrix:
        python-version: [ "3.9", "3.10", "3.11" ]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install pip==24.0
          python -m pip install pyyaml
      - name: Validate every example's benchmarkingjob/testenv/algorithm configs
        # Checks example config paths actually resolve (see scripts/ for
        # details). Uses a baseline so only new regressions fail the build;
        # remove an entry from scripts/example_config_baseline.txt once fixed.
        run: |
          python '${{github.workspace}}/scripts/validate_example_configs.py' \
            --baseline '${{github.workspace}}/scripts/example_config_baseline.txt'
